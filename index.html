<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street City Web</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d;font-family:Arial;color:white}canvas{display:block}.hud{position:fixed;z-index:10;pointer-events:none}.title{top:18px;left:20px;font-size:20px;font-weight:800;text-shadow:0 2px 5px #000}.help{bottom:18px;left:20px;background:#000b;padding:12px 14px;border-radius:10px;line-height:1.5;font-size:13px}.mission{top:18px;right:20px;background:#000b;padding:12px 14px;border-radius:10px;max-width:270px}.speed{bottom:18px;right:20px;font-size:24px;font-weight:bold;text-shadow:0 2px 5px #000}.cross{position:fixed;left:50%;top:50%;width:5px;height:5px;background:white;border-radius:50%;opacity:.6}.badge{color:#ffdf63;font-weight:bold}</style></head><body><div class="hud title">STREET CITY <span class="badge">WEB</span></div><div id="mission" class="hud mission">MISSÃO: Vá até o marcador amarelo.</div><div id="help" class="hud help">WASD — mover<br>SHIFT — correr<br>ESPAÇO — pular<br>E — entrar/sair do carro<br>Mouse — olhar (clique no jogo)</div><div id="speed" class="hud speed"></div><div class="cross"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x80b7db);scene.fog=new THREE.Fog(0x80b7db,90,240);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x555544,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(40,80,25);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x55774a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// city grid
const roadMat=mat(0x292d31),walkMat=mat(0x9a9a91);for(let i=-120;i<=120;i+=40){let r=new THREE.Mesh(new THREE.BoxGeometry(14,.08,280),roadMat);r.position.set(i,.04,0);scene.add(r);let r2=new THREE.Mesh(new THREE.BoxGeometry(280,.08,14),roadMat);r2.position.set(0,.04,i);scene.add(r2)}
// lane markings
for(let i=-120;i<=120;i+=40)for(let p=-130;p<=130;p+=12){let a=new THREE.Mesh(new THREE.BoxGeometry(.3,.03,5),mat(0xe8df9a));a.position.set(i,.1,p);scene.add(a);let b=new THREE.Mesh(new THREE.BoxGeometry(5,.03,.3),mat(0xe8df9a));b.position.set(p,.1,i);scene.add(b)}
// buildings
const colors=[0xb85c4b,0xd2a55f,0x668ca3,0x8a7771,0xb0b0a0];for(let x=-100;x<=100;x+=40)for(let z=-100;z<=100;z+=40){for(const [ox,oz] of [[-11,-11],[11,-11],[-11,11],[11,11]]){let h=10+Math.random()*30;let b=new THREE.Mesh(new THREE.BoxGeometry(14,h,14),mat(colors[(Math.random()*colors.length)|0]));b.position.set(x+ox,h/2,z+oz);b.castShadow=b.receiveShadow=true;scene.add(b);}}
// trees
for(let i=0;i<35;i++){let x=(Math.random()-.5)*250,z=(Math.random()-.5)*250;if(Math.min(...[-120,-80,-40,0,40,80,120].map(v=>Math.abs(x-v)))<10||Math.min(...[-120,-80,-40,0,40,80,120].map(v=>Math.abs(z-v)))<10)continue;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,4,8),mat(0x654321));trunk.position.set(x,2,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.6,10,8),mat(0x397d3d));crown.position.set(x,5,z);scene.add(crown)}
// player
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.2,5,10),mat(0x202735));body.position.y=1.3;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),mat(0xb9825e));head.position.y=2.55;player.add(head);scene.add(player);player.position.set(0,0,8);
// car
const car=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.1,7),mat(0xb51f2e));chassis.position.y=1.05;chassis.castShadow=true;car.add(chassis);const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.1,3.5),mat(0x263746));cabin.position.set(0,1.9,-.4);car.add(cabin);for(const x of [-2,2])for(const z of [-2.2,2.2]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,.5,12),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,.65,z);car.add(w)}car.position.set(0,0,-8);scene.add(car);
// NPCs
for(let i=0;i<14;i++){let n=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1,4,8),mat(colors[i%colors.length]));n.position.set((Math.random()-.5)*200,1,(Math.random()-.5)*200);n.userData.a=Math.random()*6.28;scene.add(n);n.userData.npc=true}
const marker=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,.15,32),new THREE.MeshBasicMaterial({color:0xffdf00,transparent:true,opacity:.75}));marker.position.set(40,.2,40);scene.add(marker);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,12,12),new THREE.MeshBasicMaterial({color:0xffdf00,transparent:true,opacity:.35}));beam.position.set(40,6,40);scene.add(beam);
let keys={},yaw=0,pitch=.18,inCar=false,vy=0,onGround=true,carSpeed=0,missionDone=false;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat){if(!inCar&&player.position.distanceTo(car.position)<6){inCar=true;player.visible=false}else if(inCar){inCar=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(4,0,0));carSpeed=0}}});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.onclick=()=>renderer.domElement.requestPointerLock();addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-.2,Math.min(.75,pitch-e.movementY*.002))}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(inCar){let accel=0;if(keys.KeyW)accel+=18;if(keys.KeyS)accel-=13;carSpeed+=accel*dt;carSpeed*=Math.pow(.96,dt*60);carSpeed=Math.max(-12,Math.min(30,carSpeed));if(Math.abs(carSpeed)>.4){let steer=(keys.KeyA?1:0)-(keys.KeyD?1:0);car.rotation.y+=steer*dt*1.4*(carSpeed/15)}let f=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));car.position.addScaledVector(f,carSpeed*dt);player.position.copy(car.position);yaw=car.rotation.y+Math.PI;document.getElementById('speed').textContent=Math.round(Math.abs(carSpeed)*7)+' km/h'}else{document.getElementById('speed').textContent='';let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyW?1:0)-(keys.KeyS?1:0);let len=Math.hypot(dx,dz);if(len){dx/=len;dz/=len;let speed=keys.ShiftLeft?10:6;let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(f.z,0,-f.x);player.position.addScaledVector(f,dz*speed*dt);player.position.addScaledVector(r,dx*speed*dt);player.rotation.y=Math.atan2(dx*f.z+dz*f.x,dx*(-f.x)+dz*f.z)}if(keys.Space&&onGround){vy=7;onGround=false}vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}}
let target=inCar?car.position:player.position;let dist=inCar?11:7,height=inCar?6:4.5;let off=new THREE.Vector3(-Math.sin(yaw)*dist,height,-Math.cos(yaw)*dist);camera.position.lerp(target.clone().add(off),1-Math.pow(.001,dt));camera.lookAt(target.clone().add(new THREE.Vector3(0,inCar?1.2:1.5,0)));marker.rotation.y+=dt;beam.material.opacity=.25+Math.sin(performance.now()*.004)*.12;if(!missionDone&&target.distanceTo(marker.position)<5){missionDone=true;document.getElementById('mission').innerHTML='<b>MISSÃO CONCLUÍDA!</b><br>Você chegou ao ponto. Explore a cidade e teste o carro.';marker.visible=beam.visible=false}scene.children.forEach(o=>{if(o.userData.npc){o.userData.a+=dt*(Math.random()-.48)*.2;o.position.x+=Math.sin(o.userData.a)*dt;o.position.z+=Math.cos(o.userData.a)*dt}});renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
